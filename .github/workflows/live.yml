# SPDX-License-Identifier: BSD-2-Clause
# Nightly contract run against the live API with a read-only CI key. Never on
# pull requests (so never from forks), and only in the upstream repository.
name: Live contract

on:
  schedule:
    - cron: '13 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Quickstart and contract run against api.oureawx.com
    if: github.repository == 'Ourea-Technologies/ensemble-weather-java'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Quickstart, anonymous
        run: ./gradlew runExample -Pexample=Quickstart
      - name: Contract run, with the read-only key
        env:
          OUREA_API_KEY: ${{ secrets.OUREA_CI_API_KEY }}
        run: ./gradlew liveContract
