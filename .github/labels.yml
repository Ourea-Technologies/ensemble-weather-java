# SPDX-License-Identifier: BSD-2-Clause
# The standard label set (SDK-STANDARD.md, "Community and contributing"),
# applied when the repository is published (for example with
# `gh label create` or a label-sync action).
- name: bug
  color: d73a4a
  description: Something is not working
- name: enhancement
  color: a2eeef
  description: A new feature or request
- name: documentation
  color: 0075ca
  description: Docs, Javadoc or examples
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: 008672
  description: Extra attention is welcome
- name: question
  color: d876e3
  description: Further information is requested
- name: needs-spec
  color: fbca04
  description: Needs an API or spec change (ensemble-weather-spec)
