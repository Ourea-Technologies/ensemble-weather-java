version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      build-tooling:
        patterns: ['*']
        exclude-patterns: ['com.fasterxml.jackson.core:*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
