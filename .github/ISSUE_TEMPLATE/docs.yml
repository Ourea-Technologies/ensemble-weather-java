# SPDX-License-Identifier: BSD-2-Clause
name: Documentation
description: A docs page, Javadoc comment or example that is wrong or unclear.
labels: [documentation]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The README section, example, Javadoc page or docs.oureawx.com URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear, and what would be better?
    validations:
      required: true
